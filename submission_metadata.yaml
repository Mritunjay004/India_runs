# ============================================================================
# AI tools declaration  (transparency only — honest)
# ============================================================================
ai_tools_used:
  - "Claude"

ai_usage_summary: |
  Used Claude (Claude Code) as a pair-programming assistant for data analysis,
  architecture discussion, code review, and drafting docs/tests. All design
  decisions, the scoring model, the honeypot signatures, and the weights were
  reviewed and owned by the team. No candidate data was sent to any hosted LLM
  during ranking — the ranking step is fully local, CPU-only, and offline.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Hybrid ranker: a precomputed CPU sentence-transformer (all-MiniLM-L6-v2) gives a
  semantic fit between each candidate's career narrative and a JD-intent query;
  an explicit additive base (semantic, career-substance, trust-weighted skills,
  experience band, evaluation rigor, education) is then passed through
  multiplicative gates — role-credibility (anti-keyword-stuffer), behavioral
  availability, location, product-vs-services, consulting/job-hopping/vision
  penalties, and a honeypot impossibility kill-factor. The additive part rates how
  good a real engineer is; the gates decide whether we believe it and can act on it.
  Honeypots are caught via three disjoint self-contradiction signatures (catching
  ~70/80 with no false positives). Ranking runs offline in <5 min on CPU. Reasoning
  strings are generated only from facts present in each candidate record.

# ============================================================================
# Declarations
# ============================================================================
declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
